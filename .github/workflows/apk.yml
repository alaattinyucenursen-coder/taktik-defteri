# Builds an installable Android app (APK) from index.html with Capacitor and attaches it to a GitHub release
name: Android APK
on:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Capacitor project
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www && cp ../index.html ../manifest.webmanifest ../*.png www/
          npx cap init "Taktik Defteri" com.alaattin.taktikdefteri --web-dir www
          npx cap add android
          npx cap sync android
      - name: App icon
        run: |
          cd app/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do cp ../../../../../../icon-192.png $d/ic_launcher.png; cp ../../../../../../icon-192.png $d/ic_launcher_round.png; rm -f $d/ic_launcher_foreground.png; done
      - name: Build
        # fixed signing key so a new APK installs over the old one and keeps the saved progress
        run: mkdir -p ~/.android && cp .github/debug.keystore ~/.android/debug.keystore && cd app/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk TaktikDefteri.apk
          gh release create "v${{ github.run_number }}" TaktikDefteri.apk --title "Taktik Defteri (Android) ${{ github.run_number }}" --notes "Tablete indirip açın. Android bilinmeyen kaynaktan yüklemeye izin istediğinde izin verin." --latest
